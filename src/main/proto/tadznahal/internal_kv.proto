syntax = "proto3";

package tadzhnahal.internal;

option java_multiple_files = true;
option java_package = "company.vk.edu.distrib.compute.tadzhnahal.grpc";
option java_outer_classname = "TadzhnahalInternalKvProto";

service InternalKvService {
  rpc handle(InternalKvRequest) returns (InternalKvResponse);
}

message InternalKvRequest {
  string method = 1;
  string id = 2;
  bytes  body = 3;
}

message InternalKvResponse {
  int32 status_code = 1;
  bytes body = 2;
}

